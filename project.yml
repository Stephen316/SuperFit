# XcodeGen spec — the Xcode project is generated from this file, not committed.
#
# A hand-maintained .xcodeproj drifts from the repo: files added on another
# machine don't appear until someone drags them in, deleted files linger as red
# references, and settings like the deployment target live only in a binary blob
# nobody reviews. Generating it means the sources on disk are the sources in the
# project, always.
#
# Run `xcodegen generate` from the repo root (brew install xcodegen), then open
# SuperFit.xcodeproj. Re-run after any git pull that adds or removes files.

name: SuperFit

options:
  bundleIdPrefix: com.stephenh
  createIntermediateGroups: true
  # Keeps Xcode's recommended-settings state in the generated project. Without
  # this, XcodeGen writes an old LastUpgradeCheck and Xcode 26 offers the same
  # one-time migration every time the project is regenerated.
  xcodeVersion: "26.6"
  # iOS 17 is a hard floor, not a preference: @Observable, safeAreaPadding and
  # scrollContentBackground are all 17-only. Below it the app will not compile.
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # SE-0418. Without it every `#Predicate` on a @Model type warns that its
    # key path literal isn't Sendable — `KeyPath<Food, UUID>` can't be, because
    # a @Model class isn't. The proposal judges a key path literal by what it
    # captures, not by its root and value types, and one with no subscript
    # arguments captures nothing. On by default under the Swift 6 language
    # mode; this turns it on early, where the warning is coming from.
    SWIFT_UPCOMING_FEATURE_INFER_SENDABLE_FROM_CAPTURES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

# Project-level so it reaches both targets: SuperFitTests needs signing too, and
# setting the team on the app alone leaves the test bundle failing to sign.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

packages:
  # Auth and the per-account backup row. Pinned by minor rather than exact so
  # security fixes arrive without a manual bump; `xcodegen generate` resolves it.
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  SuperFit:
    type: application
    platform: iOS
    # Whole-folder glob: new files are picked up on the next generate, and a
    # deleted file simply stops existing rather than becoming a broken reference.
    sources:
      - path: ios/SuperFit
        excludes:
          - "**/.DS_Store"
      # Compiled into both targets: the app starts the Live Activity, the
      # extension draws it, and they must agree on its shape.
      - path: ios/Shared
    settings:
      base:
        INFOPLIST_FILE: ios/SuperFit/SupportingFiles/Info.plist
        CODE_SIGN_ENTITLEMENTS: ios/SuperFit/SupportingFiles/SuperFit.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.stephenh.superfit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: Supabase
        product: Supabase
      - target: SuperFitWidgets
    # The entitlements file is hand-maintained and referenced by
    # CODE_SIGN_ENTITLEMENTS above. Do not add an `entitlements:` block here —
    # that makes XcodeGen *generate* the file from `properties:`, and with none
    # given it overwrites HealthKit, CloudKit and Sign in with Apple with an
    # empty dict on every `xcodegen generate`.

  # Live Activities need their own bundle: a widget extension is a separate
  # binary the system runs, so it cannot live inside the app's source glob.
  SuperFitWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ios/SuperFitWidgets
        excludes:
          - "**/.DS_Store"
          - Info.plist
      - path: ios/Shared
    settings:
      base:
        INFOPLIST_FILE: ios/SuperFitWidgets/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.stephenh.superfit.widgets
        # Must sit inside the app's identifier or the extension will not embed.
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES

  SuperFitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios/SuperFitTests
    dependencies:
      - target: SuperFit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stephenh.superfit.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SuperFit:
    build:
      targets:
        SuperFit: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SuperFitTests
